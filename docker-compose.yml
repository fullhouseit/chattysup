services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chattysup:chattysup@db:5432/chattysup
      STORAGE_PATH: /data/storage
      RUN_WORKERS: "true"
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chattysup
      POSTGRES_PASSWORD: chattysup
      POSTGRES_DB: chattysup
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chattysup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  db-data:
